# OpenSSF Scorecard: supply-chain checks on main, weekly and when branch protection changes. The results go to the
# Security tab (SARIF) and are published to the OpenSSF API for the public badge.
name: Scorecard
on:
  push: { branches: [main] }
  schedule: [{ cron: '41 5 * * 2' }]
  branch_protection_rule:
permissions: { contents: read }
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read, actions: read, security-events: write, id-token: write }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc   # v2.4.4
        with: { results_file: results.sarif, results_format: sarif, publish_results: true }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with: { name: scorecard-results, path: results.sarif, retention-days: 5 }
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26   # v4.39.2
        with: { sarif_file: results.sarif }
