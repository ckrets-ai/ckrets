# CodeQL code scanning for the JavaScript, the Python and the workflows themselves. Results go to the Security tab.
name: CodeQL
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '23 4 * * 1' }]
permissions: { contents: read }
jobs:
  analyze:
    name: 'Analyze (${{ matrix.language }})'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, security-events: write, actions: read }
    strategy:
      fail-fast: false
      matrix: { language: [actions, javascript-typescript, python] }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26   # v4.39.2
        with: { languages: '${{ matrix.language }}', build-mode: none, queries: security-extended }
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26   # v4.39.2
        with: { category: '/language:${{ matrix.language }}' }
