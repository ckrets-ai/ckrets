# On every pull request: refuse a change that adds a dependency with a known vulnerability (moderate or worse), or under
# a licence outside the allow list. Read-only, no checkout needed (the action reads the change from the API); runs on
# pull_request, never pull_request_target.
name: Dependency review
on: pull_request
permissions: { contents: read }
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294   # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, CC0-1.0, Unlicense, BlueOak-1.0.0, Python-2.0, PSF-2.0
